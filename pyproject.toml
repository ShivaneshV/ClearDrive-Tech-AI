[project]
name = "cleardrive-tech-ai"
version = "1.0.0"
description = "ClearDrive AI Next-Gen Predictive V2X Omni-Vision Edge Server"
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0.0",
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "ultralytics>=8.0.0",
    "mediapipe>=0.10.0",
    "requests>=2.28.0",
    "openai>=1.0.0",
    "tavily-python>=0.3.0",
    "torch",
    "torchvision"
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" }
]
torchvision = [
    { index = "pytorch-cpu" }
]
